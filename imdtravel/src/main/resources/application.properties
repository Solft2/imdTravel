spring.application.name=imdtravel
services.airlineshub.base-url=${AIRLINESHUB_URL:http://airlineshub:8080}
services.exchange.base-url=${EXCHANGE_URL:http://exchange:8080}
services.fidelity.base-url=${FIDELITY_URL:http://fidelity:8080}
sales.storage.directory=${SALES_DIR:./data}
logging.structured.format.console=logstash
logging.structured.json.rename.[@timestamp]=ts
logging.structured.json.rename.message=event
logging.structured.json.add.svc=imdtravel
logging.structured.json.add.cid=none
logging.structured.json.add.ms=0
